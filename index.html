<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15572e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Мои дела</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span> Мои дела</div>
      <nav class="nav" aria-label="Разделы">
        <button type="button" data-view="today" class="nav-item active">Сегодня <span id="count-today">0</span></button>
        <button type="button" data-view="inbox" class="nav-item">Входящие <span id="count-inbox">0</span></button>
        <button type="button" data-view="upcoming" class="nav-item">Ближайшие <span id="count-upcoming">0</span></button>
        <button type="button" data-view="calendar" class="nav-item">Календарь</button>
        <button type="button" data-view="nodate" class="nav-item">Без даты <span id="count-nodate">0</span></button>
        <button type="button" data-view="all" class="nav-item">Все дела <span id="count-all">0</span></button>
      </nav>
      <div class="side-label">ПРОЕКТЫ</div>
      <nav class="nav projects" id="project-nav" aria-label="Проекты"></nav>
      <button type="button" class="manage-projects" id="manage-projects">＋ Управлять проектами</button>
      <div class="account"><span id="account-label"></span><button id="sign-out" type="button" hidden>Выйти</button></div>
    </aside>

    <main class="main">
      <div id="mode-banner" class="mode-banner" hidden>Предпросмотр: дела хранятся только на этом устройстве. Синхронизация пока не подключена.</div>
      <header class="topbar">
        <div><p class="eyebrow" id="date-label"></p><h1 id="page-title">Сегодня</h1></div>
        <div class="topbar-actions"><button class="icon-button" type="button" id="mobile-projects" aria-label="Проекты">#</button><button class="icon-button" type="button" id="account-button" aria-label="Аккаунт">●</button></div>
      </header>

      <div id="day-plan" class="day-plan" hidden>
        <div><strong>План дня</strong><p id="day-plan-summary"></p></div>
        <label>Время на дела <input id="day-capacity" type="number" min="1" max="16" step="0.5" value="4"> ч</label>
      </div>

      <form id="quick-form" class="quick-form">
        <label class="visually-hidden" for="quick-title">Новое дело</label>
        <span class="quick-plus" aria-hidden="true">＋</span>
        <input id="quick-title" name="title" maxlength="160" autocomplete="off" placeholder="Добавить дело" required>
        <button type="submit" class="quick-submit" aria-label="Добавить дело">→</button>
        <div class="quick-options">
          <label>Срок <input name="dueDate" type="date"></label>
          <label>Проект <select name="project"><option value="">Без проекта</option></select></label>
          <label>Важность <select name="priority"><option value="">Обычная</option><option value="high">Высокая</option><option value="medium">Средняя</option><option value="low">Низкая</option></select></label>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="reminder-list" class="reminder-list" role="status" aria-live="polite"></div>
      <div id="sync-status" class="sync-status" role="status" aria-live="polite"></div>
      <section id="calendar" class="calendar" hidden></section>
      <div id="task-sections" class="sections"></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Разделы на телефоне">
    <button type="button" data-view="today" class="active">Сегодня</button>
    <button type="button" data-view="inbox">Входящие</button>
    <button type="button" data-view="upcoming">Ближайшие</button>
    <button type="button" data-view="calendar">Календарь</button>
    <button type="button" data-view="all">Все</button>
  </nav>

  <dialog id="task-dialog" class="dialog">
    <form id="edit-form" method="dialog">
      <div class="dialog-head"><h2>Изменить дело</h2><button type="button" data-close="task-dialog" aria-label="Закрыть">×</button></div>
      <input name="id" type="hidden">
      <label>Дело<input name="title" maxlength="160" required></label>
      <label>Срок<input name="dueDate" type="date"></label>
      <label>Проект<select name="project"><option value="">Без проекта</option></select></label>
      <label>Важность<select name="priority"><option value="">Обычная</option><option value="high">Высокая</option><option value="medium">Средняя</option><option value="low">Низкая</option></select></label>
      <label>Оценка времени, минут<input name="estimateMin" type="number" min="0" max="1440" step="5" value="0"></label>
      <label>Повторять<select name="repeat"><option value="">Не повторять</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="monthly">Каждый месяц</option></select></label>
      <label>Напомнить при открытом планере<input name="remindAt" type="datetime-local"></label>
      <label class="inline-check"><input name="plannedToday" type="checkbox"> В план на сегодня</label>
      <p id="task-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="text-button danger" id="delete-task">Удалить</button><button type="submit" class="primary-button">Сохранить</button></div>
    </form>
    <div class="task-detail-section"><h3>Шаги</h3><div id="subtask-list"></div><form id="subtask-form"><input name="text" maxlength="160" placeholder="Добавить шаг" required><button type="submit">Добавить</button></form></div>
    <div class="task-detail-section"><h3>Комментарии</h3><div id="comment-list"></div><form id="comment-form"><textarea name="text" maxlength="1000" rows="2" placeholder="Оставить комментарий" required></textarea><button type="submit">Отправить</button></form></div>
  </dialog>

  <dialog id="projects-dialog" class="dialog">
    <div class="dialog-head"><h2>Проекты</h2><button type="button" data-close="projects-dialog" aria-label="Закрыть">×</button></div>
    <div id="project-list"></div>
    <form id="project-form"><label>Новый проект<input name="name" maxlength="40" required placeholder="Название проекта"></label><button type="submit" class="primary-button">Добавить</button></form>
    <p id="project-error" class="form-error" role="alert"></p>
  </dialog>

  <dialog id="auth-dialog" class="dialog auth-dialog">
    <form id="auth-form" method="dialog">
      <div class="dialog-head"><h2 id="auth-title">Создать аккаунт</h2><button type="button" data-close="auth-dialog" aria-label="Закрыть">×</button></div>
      <p>Зарегистрируйтесь один раз, чтобы видеть свои дела на телефоне и компьютере.</p>
      <label>Почта<input name="email" type="email" autocomplete="email" required></label>
      <label>Пароль<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
      <p id="auth-error" class="form-error" role="alert"></p>
      <button type="submit" class="primary-button full" id="auth-submit">Создать аккаунт</button>
      <button type="button" class="text-button full" id="auth-switch">Уже есть аккаунт? Войти</button>
      <button type="button" class="text-button full" id="password-reset" hidden>Забыли пароль?</button>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
